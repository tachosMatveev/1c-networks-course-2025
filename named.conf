options {
    directory       "/opt/homebrew/var/named";
    pid-file        "/opt/homebrew/var/run/named.pid";
    allow-query     { any; };
    recursion       no;
    dnssec-validation auto;
    listen-on port 53 { 127.0.0.1; any; };
    listen-on-v6 { none; };
    allow-transfer  { none; };
};

logging {
    channel default_file {
        file "/opt/homebrew/var/log/named/named.log" versions 3 size 5m;
        severity info;
        print-time yes;
    };
    category default { default_file; };
};

zone "." IN {
    type hint;
    file "named.ca";
};

zone "localhost" IN {
    type master;
    file "named.local";
    allow-update { none; };
};

zone "127.in-addr.arpa" IN {
    type master;
    file "named.loopback";
};

# Наша зона
zone "example.com" IN {
    type master;
    file "db.example.com";
    allow-update { none; };
};